[package]
name = "scafra-test-service"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
scafra = "=0.1.0-snapshot.1"
scafra-bootui = "=0.1.0-snapshot.1"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
