[package]
name = "ember-test-service"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
ember = { path = "../ember/crates/ember" }
ember-bootui = { path = "../ember/crates/ember-bootui" }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
