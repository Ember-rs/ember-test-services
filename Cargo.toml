[package]
name = "scafra-test-service"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
scafra = { path = "../ember/crates/scafra", version = "=0.1.0" }
scafra-bootui = { path = "../ember/crates/scafra-bootui", version = "=0.1.0" }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
